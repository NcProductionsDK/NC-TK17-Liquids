; enabled - Master switch for all custom liquid simulation and rendering.
; particle_limit - Maximum active liquid particles (1 to 512).
; spawn_rate - Particles emitted per second (1.0 to 240.0).
; lifetime - Seconds an airborne particle can remain active (0.1 to 30.0).
; model_duration - Maximum duration of a model-triggered emission (0.1 to 30.0 seconds).
; model_pulse_count - Number of short pulses in each model emission (1 to 24).
; model_pulse_duration - Duration of each model pulse (0.05 to 2.0 seconds).
; model_pulse_interval - Delay between model pulses (0.0 to 3.0 seconds).
; model_pulse_decay - Strength reduction applied to each successive pulse (0.0 to 0.8).
; model_stream_cohesion - Seconds each pulse remains a connected ribbon before separating into droplets (0.02 to 2.0).
; model_satellite_chance - Fraction of model liquid emitted as separate smaller droplets (0.0 to 0.75).
; tool_duration - Duration of the X-key tool emission after its ray appears (0.1 to 30.0 seconds).
; tool_start_delay - Delay between CumShot and creation of the X-key tool ray (0.0 to 5.0 seconds).
[liquids]
enabled =true
particle_limit =316
spawn_rate =195.519
lifetime = 5.0
model_duration = 10.0
model_pulse_count =10
model_pulse_duration = 0.5
model_pulse_interval = 1.0
model_pulse_decay = 0.10
model_stream_cohesion =0.3
model_satellite_chance =0.06
tool_duration = 10.0
tool_start_delay = 2.0

; enabled - Retract the emitting model's testicles once for every liquid pulse. This does not alter PoseEditor sliders or tracks.
; target_weight - Additive Scrotum hard (266) pose-blend contribution at full retraction (0.0 to 1.0). The final combined weight is clamped to 1.0.
; retraction_time - Seconds taken to reach target_weight after a pulse begins (0.0 to 5.0).
; hold_time - Seconds held at full retraction for each pulse (0.0 to 5.0).
; release_time - Seconds taken to return the temporary contribution to zero (0.0 to 5.0).
; retraction_easing - Retraction transition: linear, smooth, or cubic-Bezier x1,y1,x2,y2 values such as 0.39,0.58,0.57,1.0.
; release_easing - Release transition: linear, smooth, or cubic-Bezier x1,y1,x2,y2 values such as 0.39,0.58,0.57,1.0.
; For custom Bezier values, X points must be 0.0 to 1.0 and Y points must be -2.0 to 2.0. Invalid values fall back to smooth.
[testicular_retraction]
enabled =true
target_weight = 0.25
retraction_time = 0.6
hold_time = 0.50
release_time = 0.60
retraction_easing =0, 2.0, 0.33, 0.75
release_easing =0.1, 0.80, 0.40, 1.10

; speed - Initial liquid launch speed (0.01 to 100.0).
; spread - Random directional variation applied during emission (0.0 to 2.0).
; gravity_strength - World-gravity multiplier; negative values reverse gravity (-10.0 to 10.0).
; drag - Air resistance applied to airborne liquid (0.0 to 20.0).
[liquid_physics]
speed =3.0
spread = 0.05
gravity_strength = 1.0
drag = 0.08

; size - Base particle and ribbon size (0.001 to 0.2).
; stream_thickness - Multiplier for the connected model stream only.
; stream_opacity - Overall liquid transparency (0.0 to 1.0).
; stream_base_opacity - Transparency directly at penis_jointEnd before blending into stream_opacity (0.0 to 1.0).
; stream_base_fade_length - World-space distance over which the base blends into normal stream opacity; 0 disables the base fade (0.0 to 2.0).
; stream_wobble_start - Straight world-space distance from penis_jointEnd before ribbon wobble begins (0.0 to 2.0).
; stream_wobble_fade_length - World-space distance over which wobble reaches full strength; 0 enables it immediately after stream_wobble_start (0.0 to 2.0).
; stream_bulge - Amount of natural thick/thin variation along the stream (0.0 to 0.5).
; stream_curve_smoothness - Curve samples between stream particles (1 to 12). Higher values make the ribbon smoother but require more rendering work.
; stream_curve_tension - Curve strength (0.0 to 1.0). 0.5 preserves the current natural curve; lower is restrained and higher is more sweeping.
; core_opacity - Dense milky center opacity; edges remain softly transparent (0.0 to 1.0).
; draw_layer - TK17 transparent draw priority (-1 to 100). Higher values win near-equal-depth ordering; -1 disables the priority bias. Liquid always tests scene depth without writing to it.
[liquid_visuals]
size = 0.0035
stream_thickness = 1.0
stream_opacity = 0.75
stream_base_opacity = 0.8
stream_base_fade_length = 0.2
stream_wobble_start = 0.03
stream_wobble_fade_length = 0.10
stream_bulge = 0.2
stream_curve_smoothness =12
stream_curve_tension = 1.0
core_opacity = 0.80
draw_layer = -1

; size - Base size for droplets after contact with a room object or body (0.001 to 0.2).
; opacity - Transparency for droplets after contact with a room object or body (0.0 to 1.0).
; connect_droplets - Join nearby compatible landed droplets with a thinner liquid neck.
; connection_distance - Maximum world-space distance between linked contacts (0.002 to 0.10).
; connection_thickness - Middle width relative to the endpoint droplets (0.1 to 1.0).
[liquid_contact_droplets]
size =0.00346571
opacity =0.632428
connect_droplets =true
connection_distance = 0.035
connection_thickness = 0.25

; enabled - Stop model-emitted liquid at the first visible scene surface.
; surface_hold - Seconds collided custom liquid remains visible before fading (0.05 to 10.0).
; depth_tolerance - Small depth allowance used to avoid false contacts from precision noise (0.00005 to 0.05).
; follow_bodies - Keep landed custom droplets attached to the contacted moving person.
; surface_spread - Amount a fresh custom-liquid contact gradually widens while visible (0.0 to 3.0).
; spawn_model_stains - Ask TK17 to place native sperm00-15 stains where custom liquid contacts a model or worn item.
; model_stain_rate - Maximum native stain requests per second during confirmed custom-liquid contact (1.0 to 60.0).
; native_decal_drip - Allow TK17 to animate and fade custom-liquid-created native stains; false freezes them at full weight.
[liquid_collision]
enabled =true
surface_hold = 1.75
depth_tolerance = 0.00015
follow_bodies = true
surface_spread = 0.0
spawn_model_stains =true
model_stain_rate =46.1392
native_decal_drip =false

; preset - Folder inside Extensions\Liquids\Sounds\Ejaculation. A random MP3 or WAV is played for every ejaculation pulse. false disables it.
; volume - Sound volume from -10 (near silent) to 10 (loud). 0 is the normal level.
; delay - Delay in milliseconds before each pulse sound is played (0 to 500).
; min_distance - Distance in metres where fading begins.
; max_distance - Distance in metres where the sound becomes silent.
[ejaculation_sound]
preset =Default
volume =0.0
delay =0
min_distance =0.25
max_distance =7.5

; enabled - Master switch for diagnostics and diagnostic logging.
; log_all_commands - Log every intercepted TK17 command instead of only relevant liquid commands.
; log_object_names - Log intercepted object names used by liquid discovery.
; dump_command_arguments - Include captured command argument data in diagnostic events.
; probe_known_objects - Probe known TK17 liquid objects around relevant commands.
; clear_log_on_startup - Replace the previous diagnostic log when the plugin loads.
; max_events - Maximum diagnostic events written during one game session.
; deep_event_capture - Capture additional data for selected low-level diagnostic events.
; deep_event_limit - Maximum number of deep events retained (10 to 2000).
; deep_event_bytes - Bytes captured from each deep event (64 to 1024; rounded to a multiple of four).
[diagnostics]
enabled = false
log_all_commands = false
log_object_names = false
dump_command_arguments = true
probe_known_objects = true
clear_log_on_startup = true
max_events = 3000
deep_event_capture = true
deep_event_limit = 200
deep_event_bytes = 256
